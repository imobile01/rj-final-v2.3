name: Build RJ ShiftLog APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find the project (folder or zip)
        run: |
          rm -rf build-src && mkdir build-src
          for Z in *.zip; do
            [ -f "$Z" ] || continue
            echo "Unzipping $Z"
            unzip -q -o "$Z" -d build-src
          done
          SG=$(find build-src . -name settings.gradle -not -path '*/.git/*' 2>/dev/null | head -1)
          if [ -z "$SG" ]; then
            echo "::error::No Android project found. Upload the project zip (it must contain settings.gradle) to the top of the repository."
            exit 1
          fi
          PROJ=$(dirname "$SG")
          echo "Project folder: $PROJ"
          chmod +x "$PROJ/gradlew"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - name: Build signed APK (Paul's permanent key)
        run: |
          cd "$PROJ"
          if [ ! -f app/rj-scheduler.jks ] || [ ! -f app/signing.properties ]; then
            echo "::error::Signing key missing: app/rj-scheduler.jks and app/signing.properties must be in the project."
            exit 1
          fi
          ./gradlew assembleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apk-out/RJ-ShiftLog.apk"

      - name: Check the signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs apk-out/RJ-ShiftLog.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RJ-ShiftLog-apk
          path: apk-out/*.apk
          if-no-files-found: error
